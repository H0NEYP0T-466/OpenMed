<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1560" viewBox="0 0 1500 1560"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#31434c"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="none" stroke="#31434c" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="60" y="62" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#101820">OpenMed — Sequence Diagram</text><text x="60" y="94" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#4a5b63">One case from upload to exported PDF, including the WebSocket refinement loop</text><rect x="40" y="240" width="1420" height="190" fill="#f7f4ec" stroke="#c3d0d6" stroke-width="1.2"/><text x="56" y="232" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#4a5b63">1  ingest</text><rect x="40" y="450" width="1420" height="240" fill="#eef3f5" stroke="#c3d0d6" stroke-width="1.2"/><text x="56" y="442" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#4a5b63">2  resolve organ and lazy load</text><rect x="40" y="710" width="1420" height="180" fill="#f7f4ec" stroke="#c3d0d6" stroke-width="1.2"/><text x="56" y="702" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#4a5b63">3  classify</text><rect x="40" y="910" width="1420" height="350" fill="#eef3f5" stroke="#c3d0d6" stroke-width="1.2"/><text x="56" y="902" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#4a5b63">4  segment, then refine interactively</text><rect x="40" y="1280" width="1420" height="120" fill="#f7f4ec" stroke="#c3d0d6" stroke-width="1.2"/><text x="56" y="1272" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#4a5b63">5  report</text><line x1="160" y1="200" x2="160" y2="1450" stroke="#9aa9b2" stroke-width="1.4" stroke-dasharray="6 5"/><line x1="400" y1="200" x2="400" y2="1450" stroke="#9aa9b2" stroke-width="1.4" stroke-dasharray="6 5"/><line x1="640" y1="200" x2="640" y2="1450" stroke="#9aa9b2" stroke-width="1.4" stroke-dasharray="6 5"/><line x1="880" y1="200" x2="880" y2="1450" stroke="#9aa9b2" stroke-width="1.4" stroke-dasharray="6 5"/><line x1="1120" y1="200" x2="1120" y2="1450" stroke="#9aa9b2" stroke-width="1.4" stroke-dasharray="6 5"/><line x1="1360" y1="200" x2="1360" y2="1450" stroke="#9aa9b2" stroke-width="1.4" stroke-dasharray="6 5"/><line x1="160" y1="270" x2="400" y2="270" stroke="#31434c" stroke-width="1.6" marker-end="url(#ar)"/><rect x="162.7" y="249" width="234.6" height="18" fill="#ffffff" opacity="0.95"/><text x="280.0" y="263" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">POST /api/cases (scan upload)</text><line x1="400" y1="320" x2="1360" y2="320" stroke="#31434c" stroke-width="1.6" marker-end="url(#ar)"/><rect x="794.9" y="299" width="170.2" height="18" fill="#ffffff" opacity="0.95"/><text x="880.0" y="313" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">persist sanitised scan</text><line x1="1360" y1="365" x2="400" y2="365" stroke="#31434c" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#ar)"/><rect x="848.0" y="344" width="63.9" height="18" fill="#ffffff" opacity="0.95"/><text x="880.0" y="358" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">scan_id</text><line x1="400" y1="410" x2="160" y2="410" stroke="#31434c" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#ar)"/><rect x="191.6" y="389" width="176.8" height="18" fill="#ffffff" opacity="0.95"/><text x="280.0" y="403" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">202 Accepted, scan_id</text><line x1="160" y1="490" x2="400" y2="490" stroke="#31434c" stroke-width="1.6" marker-end="url(#ar)"/><rect x="159.1" y="469" width="241.9" height="18" fill="#ffffff" opacity="0.95"/><text x="280.0" y="483" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">POST /organs/{organ}/warmup</text><line x1="400" y1="535" x2="640" y2="535" stroke="#31434c" stroke-width="1.6" marker-end="url(#ar)"/><rect x="462.9" y="514" width="114.1" height="18" fill="#ffffff" opacity="0.95"/><text x="520.0" y="528" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">ensure(organ)</text><line x1="640" y1="580" x2="880" y2="580" stroke="#31434c" stroke-width="1.6" marker-end="url(#ar)"/><rect x="635.1" y="559" width="249.8" height="18" fill="#ffffff" opacity="0.95"/><text x="760.0" y="573" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">load checkpoint and label space</text><line x1="880" y1="625" x2="400" y2="625" stroke="#31434c" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#ar)"/><rect x="555.3" y="604" width="169.4" height="18" fill="#ffffff" opacity="0.95"/><text x="640.0" y="618" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">ready, organ resident</text><line x1="400" y1="670" x2="160" y2="670" stroke="#31434c" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#ar)"/><rect x="159.5" y="649" width="241.0" height="18" fill="#ffffff" opacity="0.95"/><text x="280.0" y="663" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">model-info, classes, calibration</text><line x1="160" y1="750" x2="400" y2="750" stroke="#31434c" stroke-width="1.6" marker-end="url(#ar)"/><rect x="161.9" y="729" width="236.2" height="18" fill="#ffffff" opacity="0.95"/><text x="280.0" y="743" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">POST /organs/{organ}/classify</text><line x1="400" y1="795" x2="880" y2="795" stroke="#31434c" stroke-width="1.6" marker-end="url(#ar)"/><rect x="579.1" y="774" width="121.7" height="18" fill="#ffffff" opacity="0.95"/><text x="640.0" y="788" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">classify(image)</text><line x1="880" y1="840" x2="400" y2="840" stroke="#31434c" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#ar)"/><rect x="514.1" y="819" width="251.8" height="18" fill="#ffffff" opacity="0.95"/><text x="640.0" y="833" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">probabilities and Grad-CAM map</text><line x1="400" y1="875" x2="160" y2="875" stroke="#31434c" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#ar)"/><rect x="190.4" y="854" width="179.3" height="18" fill="#ffffff" opacity="0.95"/><text x="280.0" y="868" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">ClassificationResponse</text><line x1="160" y1="950" x2="400" y2="950" stroke="#31434c" stroke-width="1.6" marker-end="url(#ar)"/><rect x="169.1" y="929" width="221.8" height="18" fill="#ffffff" opacity="0.95"/><text x="280.0" y="943" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">POST /segment (automated)</text><line x1="400" y1="995" x2="880" y2="995" stroke="#31434c" stroke-width="1.6" marker-end="url(#ar)"/><rect x="569.5" y="974" width="141.1" height="18" fill="#ffffff" opacity="0.95"/><text x="640.0" y="988" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">segment(volume)</text><line x1="880" y1="1040" x2="400" y2="1040" stroke="#31434c" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#ar)"/><rect x="580.0" y="1019" width="120.0" height="18" fill="#ffffff" opacity="0.95"/><text x="640.0" y="1033" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">mask per class</text><line x1="160" y1="1090" x2="400" y2="1090" stroke="#31434c" stroke-width="1.6" marker-end="url(#ar)"/><rect x="186.7" y="1069" width="186.6" height="18" fill="#ffffff" opacity="0.95"/><text x="280.0" y="1083" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">WS point or box prompt</text><line x1="400" y1="1135" x2="1120" y2="1135" stroke="#31434c" stroke-width="1.6" marker-end="url(#ar)"/><rect x="644.1" y="1114" width="231.7" height="18" fill="#ffffff" opacity="0.95"/><text x="760.0" y="1128" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">encode prompt, decode mask</text><line x1="1120" y1="1180" x2="400" y2="1180" stroke="#31434c" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#ar)"/><rect x="707.1" y="1159" width="105.8" height="18" fill="#ffffff" opacity="0.95"/><text x="760.0" y="1173" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">refined mask</text><line x1="400" y1="1225" x2="160" y2="1225" stroke="#31434c" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#ar)"/><rect x="166.6" y="1204" width="226.8" height="18" fill="#ffffff" opacity="0.95"/><text x="280.0" y="1218" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">mask update over the socket</text><line x1="160" y1="1300" x2="400" y2="1300" stroke="#31434c" stroke-width="1.6" marker-end="url(#ar)"/><rect x="170.9" y="1279" width="218.3" height="18" fill="#ffffff" opacity="0.95"/><text x="280.0" y="1293" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">POST /reports (accept draft)</text><line x1="400" y1="1345" x2="1360" y2="1345" stroke="#31434c" stroke-width="1.6" marker-end="url(#ar)"/><rect x="797.1" y="1324" width="165.8" height="18" fill="#ffffff" opacity="0.95"/><text x="880.0" y="1338" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">store draft, version it</text><line x1="400" y1="1385" x2="160" y2="1385" stroke="#31434c" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#ar)"/><rect x="180.0" y="1364" width="200.1" height="18" fill="#ffffff" opacity="0.95"/><text x="280.0" y="1378" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">PDF under the 2 s budget</text><text x="60" y="1538" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#4a5b63">Only the selected organ is resident at any time; the manager unloads the previous organ before loading the next.</text></svg>