"531.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-style="italic" fill="#6b5b4a">&lt;&lt;extend&gt;&gt;</text><line x1="940.0" y1="1119.0" x2="940.0" y2="1086.0" stroke="#7a5c3e" stroke-width="1.3" stroke-dasharray="7,5"/><polygon points="940.0,1086.0 944.5,1096.0 935.5,1096.0" fill="#ffffff" stroke="#7a5c3e" stroke-width="1.3"/><rect x="902.0" y="1091.5" width="116" height="24" fill="#ffffff" opacity="0.95"/><text x="960.0" y="1111.5" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-style="italic" fill="#7a5c3e">&lt;&lt;include&gt;&gt;</text><ellipse cx="940" cy="160" rx="186" ry="56" fill="#ffffff" stroke="#2b3a42" stroke-width="1.6"/><text x="940" y="168.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#16202a">Upload &amp; Preprocess Scan</text><ellipse cx="940" cy="305" rx="186" ry="56" fill="#ffffff" stroke="#2b3a42" stroke-width="1.6"/><text x="940" y="299.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#16202a">Classify Disease Across</text><text x="940" y="328.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#16202a">Organs</text><ellipse cx="940" cy="450" rx="186" ry="56" fill="#ffffff" stroke="#2b3a42" stroke-width="1.6"/><text x="940" y="458.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#16202a">Segment Lesion</text><ellipse cx="940" cy="595" rx="186" ry="56" fill="#ffffff" stroke="#2b3a42" stroke-width="1.6"/><text x="940" y="589.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#16202a">Refine Mask with</text><text x="940" y="618.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#16202a">MedSAM-2 Prompts</text><ellipse cx="940" cy="740" rx="186" ry="56" fill="#ffffff" stroke="#2b3a42" stroke-width="1.6"/><text x="940" y="748.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#16202a">View 3D Organ &amp; Lesion</text><ellipse cx="940" cy="885" rx="186" ry="56" fill="#ffffff" stroke="#2b3a42" stroke-width="1.6"/><text x="940" y="893.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#16202a">Consult Clinical Assistant</text><ellipse cx="940" cy="1030" rx="186" ry="56" fill="#ffffff" stroke="#2b3a42" stroke-width="1.6"/><text x="940" y="1038.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#16202a">Generate Clinical Report</text><ellipse cx="940" cy="1175" rx="186" ry="56" fill="#ffffff" stroke="#2b3a42" stroke-width="1.6"/><text x="940" y="1183.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#16202a">Sign Off &amp; Export PDF</text><ellipse cx="1380" cy="300" rx="186" ry="56" fill="#ffffff" stroke="#2b3a42" stroke-width="1.6"/><text x="1380" y="308.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#16202a">Review Finalized Report</text><ellipse cx="1380" cy="450" rx="186" ry="56" fill="#ffffff" stroke="#2b3a42" stroke-width="1.6"/><text x="1380" y="458.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#16202a">Add Consultation Note</text><ellipse cx="1380" cy="620" rx="186" ry="56" fill="#ffffff" stroke="#2b3a42" stroke-width="1.6"/><text x="1380" y="628.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#16202a">Practice in Training Mode</text><ellipse cx="1380" cy="790" rx="186" ry="56" fill="#ffffff" stroke="#2b3a42" stroke-width="1.6"/><text x="1380" y="784.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#16202a">Manage Users &amp;</text><text x="1380" y="813.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#16202a">System Settings</text><ellipse cx="1380" cy="960" rx="186" ry="56" fill="#ffffff" stroke="#2b3a42" stroke-width="1.6"/><text x="1380" y="968.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#16202a">Review Audit Trail</text><g stroke="#1f2d33" stroke-width="2.4" fill="none" stroke-linecap="round"><circle cx="112" cy="616" r="13"/><line x1="112" y1="629" x2="112" y2="666"/><line x1="89" y1="643" x2="135" y2="643"/><line x1="112" y1="666" x2="93" y2="700"/><line x1="112" y1="666" x2="131" y2="700"/></g><text x="112" y="742" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" fill="#1f2d33">Radiologist /</text><text x="112" y="769" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" fill="#1f2d33">Medical Specialist</text><g stroke="#1f2d33" stroke-width="2.4" fill="none" stroke-linecap="round"><circle cx="1660" cy="331" r="13"/><line x1="1660" y1="344" x2="1660" y2="381"/><line x1="1637" y1="358" x2="1683" y2="358"/><line x1="1660" y1="381" x2="1641" y2="415"/><line x1="1660" y1="381" x2="1679" y2="415"/></g><text x="1660" y="457" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" fill="#1f2d33">Referring Doctor</text><g stroke="#1f2d33" stroke-width="2.4" fill="none" stroke-linecap="round"><circle cx="1660" cy="576" r="13"/><line x1="1660" y1="589" x2="1660" y2="626"/><line x1="1637" y1="603" x2="1683" y2="603"/><line x1="1660" y1="626" x2="1641" y2="660"/><line x1="1660" y1="626" x2="1679" y2="660"/></g><text x="1660" y="702" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" fill="#1f2d33">Radiology Resident</text><text x="1660" y="729" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" fill="#1f2d33">/</text><text x="1660" y="756" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" fill="#1f2d33">Student</text><g stroke="#1f2d33" stroke-width="2.4" fill="none" stroke-linecap="round"><circle cx="1660" cy="901" r="13"/><line x1="1660" y1="914" x2="1660" y2="951"/><line x1="1637" y1="928" x2="1683" y2="928"/><line x1="1660" y1="951" x2="1641" y2="985"/><line x1="1660" y1="951" x2="1679" y2="985"/></g><text x="1660" y="1027" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" fill="#1f2d33">System</text><text x="1660" y="1054" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" fill="#1f2d33">Administrator</text><path d="M160,1300 h622 l18,18 v142 h-640 z" fill="#fbfaf0" stroke="#b8ad74" stroke-width="1.2"/><path d="M782,1300 v18 h18" fill="none" stroke="#b8ad74" stroke-width="1.2"/><text x="172" y="1324" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#5d5326">Organ modules</text><text x="172" y="1350" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#4b431f">Brain · Lungs · Heart · Liver · Kidneys · Pancreas</text><text x="172" y="1374" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#4b431f">Breast · Skin · Eye/Retina · Blood/Vascular · Bone/Skeleton</text><text x="172" y="1398" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#4b431f">plus the full-body atlas. Each organ carries its own</text><text x="172" y="1422" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#4b431f">classifier and segmentation pipeline; organ pairs that need</text><text x="172" y="1446" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#4b431f">it run a two-model mixture of experts.</text><path d="M840,1300 h662 l18,18 v142 h-680 z" fill="#fbfaf0" stroke="#b8ad74" stroke-width="1.2"/><path d="M1502,1300 v18 h18" fill="none" stroke="#b8ad74" stroke-width="1.2"/><text x="852" y="1324" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#5d5326">Rules the model keeps</text><text x="852" y="1350" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#4b431f">Findings are assistive only; a licensed clinician signs</text><text x="852" y="1374" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#4b431f">off before export. Trainees cannot finalize records.</text><text x="852" y="1398" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#4b431f">Scans, masks and reports never leave the clinic network.</text><text x="852" y="1422" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#4b431f">One organ pipeline resident in RAM at a time (8 GB).</text><text x="852" y="1446" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#4b431f">Model weights load on demand and unload on organ switch.</text></svg>