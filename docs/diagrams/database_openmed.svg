PTZ NULL</text><text x="570" y="580" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#37474f">pdf_path TEXT NULL</text><rect x="1060" y="430" width="380" height="156" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><rect x="1060" y="430" width="380" height="30" fill="#eef3f5" stroke="#22323b" stroke-width="1.2"/><text x="1070" y="451" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#15242c">classification_result</text><rect x="1060" y="460" width="380" height="21" fill="#fafafa" stroke="none"/><text x="1070" y="475" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#37474f">result_id TEXT PK</text><text x="1070" y="496" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#37474f">series_id TEXT FK scan_series</text><rect x="1060" y="502" width="380" height="21" fill="#fafafa" stroke="none"/><text x="1070" y="517" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#37474f">model_id TEXT FK model_registry</text><text x="1070" y="538" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#37474f">predicted_class TEXT NOT NULL</text><rect x="1060" y="544" width="380" height="21" fill="#fafafa" stroke="none"/><text x="1070" y="559" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#37474f">confidence REAL NOT NULL</text><text x="1070" y="580" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#37474f">label_space TEXT NOT NULL</text><rect x="60" y="690" width="380" height="156" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><rect x="60" y="690" width="380" height="30" fill="#eef3f5" stroke="#22323b" stroke-width="1.2"/><text x="70" y="711" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#15242c">audit_log</text><rect x="60" y="720" width="380" height="21" fill="#fafafa" stroke="none"/><text x="70" y="735" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#37474f">log_id BIGSERIAL PK</text><text x="70" y="756" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#37474f">actor_id TEXT FK app_user</text><rect x="60" y="762" width="380" height="21" fill="#fafafa" stroke="none"/><text x="70" y="777" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#37474f">action TEXT NOT NULL</text><text x="70" y="798" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#37474f">entity TEXT NOT NULL</text><rect x="60" y="804" width="380" height="21" fill="#fafafa" stroke="none"/><text x="70" y="819" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#37474f">entity_id TEXT NOT NULL</text><text x="70" y="840" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#37474f">occurred_at TIMESTAMPTZ NOT NULL</text><rect x="1060" y="690" width="380" height="156" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><rect x="1060" y="690" width="380" height="30" fill="#eef3f5" stroke="#22323b" stroke-width="1.2"/><text x="1070" y="711" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#15242c">segmentation_mask</text><rect x="1060" y="720" width="380" height="21" fill="#fafafa" stroke="none"/><text x="1070" y="735" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#37474f">mask_id TEXT PK</text><text x="1070" y="756" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#37474f">result_id TEXT FK classification_result</text><rect x="1060" y="762" width="380" height="21" fill="#fafafa" stroke="none"/><text x="1070" y="777" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#37474f">model_id TEXT FK model_registry</text><text x="1070" y="798" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#37474f">prompt_mode TEXT CHECK (auto|point|box)</text><rect x="1060" y="804" width="380" height="21" fill="#fafafa" stroke="none"/><text x="1070" y="819" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#37474f">mask_path TEXT NOT NULL</text><text x="1070" y="840" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#37474f">volume_mm3 REAL NULL</text><text x="60" y="900" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#4a5b63">Indexes: UNIQUE(app_user.email) · UNIQUE(scan_series.scan_id) · UNIQUE(report_version.case_id, version) · INDEX(audit_log.occurred_at) · INDEX(classification_result.series_id)</text><text x="60" y="926" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#4a5b63">segmentation_mask.model_id carries the same foreign key to model_registry as classification_result does; one arrow is drawn to keep the figure readable.</text><text x="60" y="1018" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#4a5b63">Append-only by policy: report_version never loses a row and the application role holds no UPDATE or DELETE grant on audit_log.</text></svg>