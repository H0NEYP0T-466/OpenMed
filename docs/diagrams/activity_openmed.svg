<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2080" viewBox="0 0 1500 2080"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#31434c"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="none" stroke="#31434c" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="60" y="62" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#101820">OpenMed — Activity Diagram</text><text x="60" y="94" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#4a5b63">One case, ingestion to signed report, with the interactive refinement loop</text><path d="M 330.0 190.0 L 330.0 230.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><path d="M 330.0 306.0 L 330.0 340.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><path d="M 330.0 416.0 L 330.0 423.0 L 720.0 423.0 L 720.0 430.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><path d="M 900.0 478.0 L 960.0 468.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><rect x="917.7" y="451.0" width="24.7" height="18" fill="#ffffff" opacity="0.93"/><text x="930.0" y="464.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">no</text><path d="M 1180.0 430.0 L 1180.0 210.0 L 330.0 210.0 L 330.0 230.0" fill="none" stroke="#31434c" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#ar)"/><rect x="716.2" y="308.0" width="77.5" height="18" fill="#ffffff" opacity="0.93"/><text x="755.0" y="321.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">re-upload</text><path d="M 720.0 526.0 L 720.0 548.0 L 330.0 548.0 L 330.0 570.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><rect x="509.0" y="526.0" width="31.9" height="18" fill="#ffffff" opacity="0.93"/><text x="525.0" y="539.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">yes</text><path d="M 330.0 646.0 L 330.0 680.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><path d="M 330.0 756.0 L 330.0 790.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><path d="M 330.0 866.0 L 330.0 900.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><path d="M 330.0 976.0 L 330.0 1010.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><path d="M 330.0 1086.0 L 330.0 1120.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><path d="M 330.0 1196.0 L 330.0 1233.0 L 720.0 1233.0 L 720.0 1270.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><path d="M 900.0 1318.0 L 960.0 1438.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><rect x="927.0" y="1370.0" width="24.7" height="18" fill="#ffffff" opacity="0.93"/><text x="930.0" y="1383.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">no</text><path d="M 1180.0 1400.0 L 1180.0 1250.0 L 720.0 1250.0 L 720.0 1270.0" fill="none" stroke="#31434c" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#ar)"/><rect x="914.8" y="1313.0" width="70.4" height="18" fill="#ffffff" opacity="0.93"/><text x="950.0" y="1326.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">re-check</text><path d="M 720.0 1366.0 L 720.0 1433.0 L 330.0 1433.0 L 330.0 1500.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><rect x="509.0" y="1411.0" width="31.9" height="18" fill="#ffffff" opacity="0.93"/><text x="525.0" y="1424.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">yes</text><path d="M 330.0 1576.0 L 330.0 1610.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><path d="M 330.0 1686.0 L 330.0 1720.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><path d="M 330.0 1796.0 L 330.0 1830.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><path d="M 330.0 1906.0 L 330.0 1940.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><ellipse cx="330.0" cy="150.0" rx="45.0" ry="40.0" fill="#ffffff" stroke="#22323b" stroke-width="1.8"/><text x="330.0" y="156.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c"></text><rect x="100" y="230" width="460" height="76" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="112" y="257" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">1. Upload medical scan</text><text x="112" y="280" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">DICOM, PNG, JPEG or NIfTI, single file or series</text><rect x="100" y="340" width="460" height="76" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="112" y="367" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">2. Validate and sanitise</text><text x="112" y="390" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">format allow-list · strip EXIF and identifiers</text><polygon points="720.0,430 900,478.0 720.0,526 540,478.0" fill="#ffffff" stroke="#22323b" stroke-width="1.8"/><text x="720.0" y="474.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">Format valid?</text><rect x="960" y="430" width="440" height="76" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="972" y="457" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">Reject with an amber banner</text><text x="972" y="480" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">no inference runs · the user re-uploads</text><rect x="100" y="570" width="460" height="76" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="112" y="597" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">3. Resolve the organ module</text><text x="112" y="620" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">registry lookup by organ and modality</text><rect x="100" y="680" width="460" height="76" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="112" y="707" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">4. Lazy-load organ weights</text><text x="112" y="730" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">warmup call · any resident organ unloaded first</text><rect x="100" y="790" width="460" height="76" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="112" y="817" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">5. Preprocess to model spec</text><text x="112" y="840" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">resize · normalise · channel order, per manifest</text><rect x="100" y="900" width="460" height="76" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="112" y="927" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">6. Classify</text><text x="112" y="950" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">per-organ head · calibrated probabilities</text><rect x="100" y="1010" width="460" height="76" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="112" y="1037" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">7. Localise</text><text x="112" y="1060" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">Grad-CAM heat map reduced to a lesion box</text><rect x="100" y="1120" width="460" height="76" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="112" y="1147" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">8. Automated segmentation</text><text x="112" y="1170" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">organ-specific segmenter · mask per class</text><polygon points="720.0,1270 900,1318.0 720.0,1366 540,1318.0" fill="#ffffff" stroke="#22323b" stroke-width="1.8"/><text x="720.0" y="1314.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">Mask accepted?</text><rect x="960" y="1400" width="440" height="76" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="972" y="1427" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">Refine with a prompt</text><text x="972" y="1450" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">point or box on the mask (MedSAM-2)</text><text x="972" y="1473" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">mask refreshes over the WebSocket</text><rect x="100" y="1500" width="460" height="76" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="112" y="1527" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">9. Project onto the 3D atlas</text><text x="112" y="1550" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">mask mapped to the organ mesh · orbit and explode</text><rect x="100" y="1610" width="460" height="76" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="112" y="1637" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">10. Draft the clinical report</text><text x="112" y="1660" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">findings · measurements · mandatory disclaimer</text><rect x="100" y="1720" width="460" height="76" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="112" y="1747" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">11. Clinician review and sign-off</text><text x="112" y="1770" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">edit, accept or discard before export</text><rect x="100" y="1830" width="460" height="76" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="112" y="1857" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">12. Export PDF, close the case</text><text x="112" y="1880" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">versioned record · audit entry written</text><ellipse cx="330.0" cy="1980.0" rx="45.0" ry="40.0" fill="#ffffff" stroke="#22323b" stroke-width="1.8"/><text x="330.0" y="1986.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c"></text><text x="60" y="2058" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#4a5b63">Every state change writes an audit entry. No step writes to a patient record without clinician sign-off.</text></svg>