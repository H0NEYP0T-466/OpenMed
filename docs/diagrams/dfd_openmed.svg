ly="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">study + metadata</text><path d="M 475.0 330.0 L 302.0 330.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><rect x="304.3" y="306.0" width="168.4" height="18" fill="#ffffff" opacity="0.95"/><text x="388.5" y="320.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">findings, masks, draft</text><path d="M 1050.0 290.0 L 1198.0 290.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><rect x="1070.8" y="266.0" width="106.3" height="18" fill="#ffffff" opacity="0.95"/><text x="1124.0" y="280.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">signed report</text><path d="M 180.0 580.0 L 180.0 658.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><rect x="186.0" y="610.0" width="103.4" height="18" fill="#ffffff" opacity="0.95"/><text x="189.0" y="624.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">study upload</text><path d="M 180.0 792.0 L 180.0 858.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><rect x="186.0" y="816.0" width="118.0" height="18" fill="#ffffff" opacity="0.95"/><text x="189.0" y="830.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">scan + sha256</text><path d="M 300.0 725.0 L 438.0 725.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><rect x="294.2" y="701.0" width="149.6" height="18" fill="#ffffff" opacity="0.95"/><text x="369.0" y="715.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">normalised volume</text><path d="M 610.0 858.0 L 610.0 792.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><rect x="616.0" y="816.0" width="119.4" height="18" fill="#ffffff" opacity="0.95"/><text x="619.0" y="830.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">checkpoint + T</text><path d="M 680.0 725.0 L 818.0 725.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><rect x="683.6" y="701.0" width="130.9" height="18" fill="#ffffff" opacity="0.95"/><text x="749.0" y="715.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">class + CAM box</text><path d="M 1060.0 725.0 L 1198.0 725.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><rect x="1051.8" y="701.0" width="154.4" height="18" fill="#ffffff" opacity="0.95"/><text x="1129.0" y="715.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">mask, area, volume</text><path d="M 1340.0 792.0 L 1340.0 858.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><rect x="1346.0" y="816.0" width="92.3" height="18" fill="#ffffff" opacity="0.95"/><text x="1349.0" y="830.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">draft report</text><path d="M 1340.0 658.0 L 1340.0 582.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><rect x="1247.3" y="611.0" width="89.7" height="18" fill="#ffffff" opacity="0.95"/><text x="1334.0" y="625.0" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">signed PDF</text><rect x="60" y="245" width="240" height="90" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="72" y="272" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">Clinician</text><text x="72" y="295" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">orders the study</text><text x="72" y="318" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">signs the report</text><ellipse cx="750.0" cy="290.0" rx="300.0" ry="100.0" fill="#ffffff" stroke="#22323b" stroke-width="1.8"/><text x="750.0" y="296.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">0 · OpenMed platform</text><rect x="1200" y="245" width="240" height="90" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="1212" y="272" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">Hospital records</text><text x="1212" y="295" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">signed reports only</text><text x="1212" y="318" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">PACS archive</text><rect x="60" y="500" width="240" height="80" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="72" y="527" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">Clinician</text><text x="72" y="550" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">uploads and reviews</text><rect x="1200" y="500" width="240" height="80" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="1212" y="527" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">Hospital records</text><text x="1212" y="550" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">receives signed PDF</text><ellipse cx="180.0" cy="725.0" rx="120.0" ry="65.0" fill="#ffffff" stroke="#22323b" stroke-width="1.8"/><text x="180.0" y="731.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">1.0 Ingest</text><ellipse cx="560.0" cy="725.0" rx="120.0" ry="65.0" fill="#ffffff" stroke="#22323b" stroke-width="1.8"/><text x="560.0" y="731.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">2.0 Classify</text><ellipse cx="940.0" cy="725.0" rx="12