ans-serif" font-size="17" font-weight="700" fill="#15242c">D3</text><text x="876" y="886" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">audit log</text><path d="M 1440 860 L 1200 860 L 1200 936 L 1440 936" fill="none" stroke="#22323b" stroke-width="1.8"/><rect x="1200" y="860" width="44" height="76" fill="#eef3f5" stroke="none"/><path d="M 1200 860 L 1200 936" stroke="#22323b" stroke-width="1.8"/><line x1="1244" y1="860" x2="1244" y2="936" stroke="#22323b" stroke-width="1.2"/><text x="1222" y="904.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#15242c">D4</text><text x="1256" y="886" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">report versions</text><text x="60" y="415" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#4a5b63">Sixteen organ modules sit inside process 0. At this level they are one process because the clinician sees one workstation.</text><text x="60" y="1098" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#4a5b63">D3 (audit log) is appended by every process, 1.0 to 4.0; drawing those four flows would bury the figure, so its inbound flows are stated here instead. D2 holds one checkpoint and one label-space sidecar per organ and task.</text></svg>