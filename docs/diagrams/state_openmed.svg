<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#31434c"/></marker><marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="none" stroke="#31434c" stroke-width="1.4"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 12 6 L 0 12 z" fill="#ffffff" stroke="#31434c" stroke-width="1.4"/></marker><marker id="dia" viewBox="0 0 14 12" refX="13" refY="6" markerWidth="11" markerHeight="10" orient="auto-start-reverse"><path d="M 0 6 L 7 0 L 14 6 L 7 12 z" fill="#31434c"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="60" y="62" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#101820">OpenMed — Organ Lifecycle State Machine</text><text x="60" y="94" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#4a5b63">Rule 4 in the SRS keeps one organ resident at a time; this is the machine that enforces it</text><circle cx="240" cy="150" r="11" fill="#22323b"/><path d="M 240.0 161.0 L 240.0 198.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><path d="M 390.0 246.0 L 558.0 246.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><rect x="400.3" y="222.0" width="147.3" height="18" fill="#ffffff" opacity="0.95"/><text x="474.0" y="236.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">POST /load-models</text><path d="M 880.0 246.0 L 1028.0 246.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><rect x="888.8" y="222.0" width="130.3" height="18" fill="#ffffff" opacity="0.95"/><text x="954.0" y="236.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">weights resident</text><path d="M 1200.0 292.0 L 1200.0 468.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><rect x="854.4" y="371.0" width="342.6" height="18" fill="#ffffff" opacity="0.95"/><text x="1194.0" y="385.0" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">unload-models, or a second organ requested</text><path d="M 1030.0 516.0 L 882.0 516.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><rect x="921.6" y="492.0" width="68.8" height="18" fill="#ffffff" opacity="0.95"/><text x="956.0" y="506.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">del + gc</text><path d="M 560.0 516.0 L 460.0 516.0 L 460.0 640.0 L 240.0 640.0 L 240.0 294.0" fill="none" stroke="#31434c" stroke-width="1.7" marker-end="url(#ar)"/><rect x="245.4" y="616.0" width="209.2" height="18" fill="#ffffff" opacity="0.95"/><text x="350.0" y="630.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">release_runtime_memory()</text><path d="M 1370.0 246.0 L 1410.0 246.0 L 1410.0 766.0 L 882.0 766.0" fill="none" stroke="#31434c" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#ar)"/><rect x="1062.4" y="742.0" width="167.2" height="18" fill="#ffffff" opacity="0.95"/><text x="1146.0" y="756.0" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">OOM or adapter error</text><path d="M 560.0 766.0 L 52.0 766.0 L 52.0 246.0 L 88.0 246.0" fill="none" stroke="#31434c" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#ar)"/><rect x="58.0" y="497.0" width="123.6" height="18" fill="#ffffff" opacity="0.95"/><text x="61.0" y="511.0" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#3d4f58">operator retries</text><rect x="90" y="200" width="300" height="92" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="102" y="227" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">Unloaded</text><text x="102" y="250" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">no weights in RAM</text><text x="102" y="273" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">is_loaded is False</text><rect x="560" y="200" width="320" height="92" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="572" y="227" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">Warming</text><text x="572" y="250" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">state_dict read from disk</text><text x="572" y="273" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">labels and manifest parsed</text><rect x="1030" y="200" width="340" height="92" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="1042" y="227" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">Active</text><text x="1042" y="250" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">forward pass served</text><text x="1042" y="273" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">one organ only</text><rect x="560" y="470" width="320" height="92" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="572" y="497" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">Released</text><text x="572" y="520" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">refs dropped, cache emptied</text><text x="572" y="543" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">RSS back near baseline</text><rect x="1030" y="470" width="340" height="92" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="1042" y="497" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">Unloading</text><text x="1042" y="520" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">del model, gc.collect()</text><rect x="560" y="720" width="320" height="92" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="572" y="747" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">Unavailable</text><text x="572" y="770" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">adapter reports available=False</text><text x="60" y="880" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#4a5b63">Rule 4: only one organ is resident at a time. Selecting a different organ unloads the current one before the next checkpoint is read.</text><text x="60" y="906" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#4a5b63">/health reports current_rss_mb(), so an unload can be shown to have actually returned memory rather than merely dropped a reference.</text><text x="60" y="958" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#4a5b63">A transition that raises leaves the organ in Unavailable, never half-loaded: the pipeline drops its partial state before the exception reaches the router.</text></svg>