ad().</text><text x="60" y="1036" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#4a5b63">Hollow triangle is generalization: AnalyzeResponse is a ClassificationResponse plus one segmentation field; MedSAM2Adapter satisfies LabAdapter.</text><text x="60" y="1058" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#4a5b63">Training-only modules (datasets, split planners, augmentation policy) are deliberately absent: they never ship inside the inference service.</text></svg>