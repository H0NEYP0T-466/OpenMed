sans-serif" font-size="20" font-weight="700" fill="#15242c">Dataset registry</text><text x="1122" y="858" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">counts, licences, provenance</text><text x="60" y="998" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#4a5b63">Adapters are shared code; weights and configuration are not. Each organ module owns its own checkpoint and manifest, and the calibration sidecar reads its temperature from the manifest beside that checkpoint.</text></svg>