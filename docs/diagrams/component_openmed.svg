point and box prompts</text><rect x="912" y="160" width="264" height="84" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="924" y="187" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">3D atlas viewer</text><text x="924" y="210" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">Three.js canvas</text><rect x="1196" y="160" width="264" height="84" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="1208" y="187" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">Report editor</text><text x="1208" y="210" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">draft and sign-off</text><rect x="60" y="322" width="264" height="84" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="72" y="349" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">Case router</text><text x="72" y="372" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">upload, sanitise</text><rect x="344" y="322" width="264" height="84" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="356" y="349" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">Organ router</text><text x="356" y="372" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">classify, segment</text><rect x="628" y="322" width="264" height="84" fill="#ffffff" stroke="#22323b" stroke-width="1.8" rx="4"/><text x="640" y="349" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#15242c">Report router</text><text x="640" y="372" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#37474f">draft, export</text><rect x="912" y="322" width="264" height="84